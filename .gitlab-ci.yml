# ─── Intellicore CMP — GitLab CI/CD Pipeline (Searce GCP) ────────────────────
#
# This is the SINGLE source of CI/CD truth. The former GitHub Actions workflows
# (.github/workflows/) were removed in the GitLab migration; all four jobs
# — ci, deploy-production, deploy-staging, deploy-customer — live here now.
#
# Stages:
#   1. validate  — lint + type-check frontend, byte-compile backend
#   2. build     — production Next.js build (catches errors before deploy)
#   3. deploy    — ship to GCP VM over an IAP tunnel (no open port 22)
#   4. provision — manual: stand up a brand-new customer environment
#
# ── Deploy mechanism ─────────────────────────────────────────────────────────
# Code is packaged as a tarball and copied to the VM over the IAP tunnel, then
# swapped into place blue-green with an automatic rollback on health-check
# failure. The VM does NOT pull from GitLab, so no deploy token is needed on
# the VM and no VM→gitlab.searce.com network path has to exist.
#
# ── Required CI/CD Variables (Settings → CI/CD → Variables) ──────────────────
#
#   GCP_SA_KEY       File      CI/CD service account JSON key
#                              (generated by deploy/gcp/setup-searce-gcp.sh)
#                              Protect: yes. Mask: NO (JSON can't be masked).
#   GCP_PROJECT_ID   Variable  e.g. atre-practice-solutionplatform
#   VM_NAME          Variable  e.g. intellicore-cmp-v1
#   VM_ZONE          Variable  e.g. asia-south1-a
#   VM_USER          Variable  SSH user on the VM
#                              (gcloud compute ssh $VM_NAME --zone $VM_ZONE --command whoami)
#   DOMAIN           Variable  e.g. 35-200-215-108.sslip.io
#
#   Staging only (optional): STAGING_VM_NAME, STAGING_VM_ZONE, STAGING_DOMAIN
#
# Full guide: deploy/gcp/GITLAB_CI.md
# Migration:  deploy/gcp/MIGRATE_TO_GITLAB.md
# ─────────────────────────────────────────────────────────────────────────────

default:
  interruptible: true

stages:
  - validate
  - build
  - deploy
  - provision

# ── Pipeline inputs for the manual customer-provisioning job ─────────────────
# These surface as fields on the "Run pipeline" form in the GitLab UI.
# They are empty on normal branch pipelines and ignored by every other job.

variables:
  CUSTOMER_NAME:
    value: ""
    description: "Customer provisioning only — customer name (lowercase, no spaces)."
  CUSTOMER_GCP_PROJECT_ID:
    value: ""
    description: "Customer provisioning only — GCP Project ID for this customer."
  CUSTOMER_REGION:
    value: "asia-south1"
    options: ["asia-south1", "us-central1", "europe-west1", "asia-southeast1"]
    description: "Customer provisioning only — GCP region."
  CUSTOMER_MACHINE_TYPE:
    value: "e2-standard-2"
    options: ["e2-standard-2", "e2-standard-4", "e2-standard-8"]
    description: "Customer provisioning only — VM machine type."
  CUSTOMER_ADMIN_EMAIL:
    value: ""
    description: "Customer provisioning only — admin email for this customer."

# ─────────────────────────────────────────────────────────────────────────────
# Reusable templates
# ─────────────────────────────────────────────────────────────────────────────

# Authenticate the runner as the CI/CD service account.
.gcp_auth: &gcp_auth
  - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
  - gcloud config set project "$GCP_PROJECT_ID"
  - gcloud auth list --filter=status:ACTIVE --format="value(account)"

# Package the working tree for shipment. Excludes build output and VCS
# metadata; .gitlab-ci.yml itself is intentionally included.
.package: &package
  - |
    tar --exclude=node_modules --exclude=.next --exclude=__pycache__ \
        --exclude=.venv --exclude=.git --exclude='*.pyc' \
        -czf /tmp/intellicore-cmp.tar.gz .
    echo "Package size: $(du -h /tmp/intellicore-cmp.tar.gz | cut -f1)"

.gcloud_image:
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp_auth

# ─────────────────────────────────────────────────────────────────────────────
# 1 · Validate  (ported from .github/workflows/ci.yml)
# ─────────────────────────────────────────────────────────────────────────────

frontend:lint:
  stage: validate
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

backend:check:
  stage: validate
  image: python:3.11-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  script:
    - cd backend
    - pip install -r requirements.txt
    - python -m compileall -q app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─────────────────────────────────────────────────────────────────────────────
# 2 · Build
# ─────────────────────────────────────────────────────────────────────────────

frontend:build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─────────────────────────────────────────────────────────────────────────────
# 3 · Deploy  (ported from deploy-production.yml / deploy-staging.yml)
# ─────────────────────────────────────────────────────────────────────────────

deploy:production:
  stage: deploy
  extends: .gcloud_image
  environment:
    name: production
    url: https://$DOMAIN
  resource_group: production      # serialise deploys, never cancel mid-flight
  interruptible: false
  script:
    - *package
    - |
      gcloud compute scp /tmp/intellicore-cmp.tar.gz \
        "${VM_USER}@${VM_NAME}":/tmp/ \
        --zone="${VM_ZONE}" \
        --tunnel-through-iap \
        --scp-flag="-o StrictHostKeyChecking=no"
    - |
      gcloud compute ssh "${VM_USER}@${VM_NAME}" \
        --zone="${VM_ZONE}" \
        --tunnel-through-iap \
        --ssh-flag="-o StrictHostKeyChecking=no" \
        --ssh-flag="-o ServerAliveInterval=30" \
        --command='
          set -euo pipefail

          echo "── Unpacking release ────────────────────────"
          rm -rf ~/intellicore-cmp-new
          mkdir -p ~/intellicore-cmp-new
          tar -xzf /tmp/intellicore-cmp.tar.gz -C ~/intellicore-cmp-new

          # .env.prod is gitignored and lives only on the VM — carry it over.
          if [ ! -f ~/intellicore-cmp/.env.prod ]; then
            echo "✘ ~/intellicore-cmp/.env.prod missing — refusing to deploy"
            exit 1
          fi
          cp ~/intellicore-cmp/.env.prod ~/intellicore-cmp-new/.env.prod
          chmod 600 ~/intellicore-cmp-new/.env.prod

          echo "── Blue-green swap ──────────────────────────"
          rm -rf ~/intellicore-cmp-rollback
          mv ~/intellicore-cmp ~/intellicore-cmp-rollback
          mv ~/intellicore-cmp-new ~/intellicore-cmp

          cd ~/intellicore-cmp
          bash deploy/gcp/update.sh

          echo "── Health check ─────────────────────────────"
          HEALTHY=false
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              HEALTHY=true; break
            fi
            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "✘ HEALTH CHECK FAILED — rolling back"
            rm -rf ~/intellicore-cmp-failed
            mv ~/intellicore-cmp ~/intellicore-cmp-failed
            mv ~/intellicore-cmp-rollback ~/intellicore-cmp
            cd ~/intellicore-cmp
            bash deploy/gcp/update.sh
            exit 1
          fi

          echo "✔ Production deployment successful"
          rm -f /tmp/intellicore-cmp.tar.gz
        '
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  needs:
    - frontend:build
  timeout: 20 minutes

deploy:staging:
  stage: deploy
  extends: .gcloud_image
  environment:
    name: staging
    url: https://$STAGING_DOMAIN
  resource_group: staging
  script:
    - *package
    - |
      gcloud compute scp /tmp/intellicore-cmp.tar.gz \
        "${VM_USER}@${STAGING_VM_NAME}":/tmp/ \
        --zone="${STAGING_VM_ZONE}" \
        --tunnel-through-iap \
        --scp-flag="-o StrictHostKeyChecking=no"
    - |
      gcloud compute ssh "${VM_USER}@${STAGING_VM_NAME}" \
        --zone="${STAGING_VM_ZONE}" \
        --tunnel-through-iap \
        --ssh-flag="-o StrictHostKeyChecking=no" \
        --command='
          set -euo pipefail
          rm -rf ~/intellicore-cmp-new
          mkdir -p ~/intellicore-cmp-new
          tar -xzf /tmp/intellicore-cmp.tar.gz -C ~/intellicore-cmp-new

          if [ -f ~/intellicore-cmp/.env.prod ]; then
            cp ~/intellicore-cmp/.env.prod ~/intellicore-cmp-new/.env.prod
            chmod 600 ~/intellicore-cmp-new/.env.prod
          else
            echo "✘ ~/intellicore-cmp/.env.prod missing — refusing to deploy"
            exit 1
          fi

          rm -rf ~/intellicore-cmp-rollback
          [ -d ~/intellicore-cmp ] && mv ~/intellicore-cmp ~/intellicore-cmp-rollback
          mv ~/intellicore-cmp-new ~/intellicore-cmp

          cd ~/intellicore-cmp
          bash deploy/gcp/update.sh
          rm -f /tmp/intellicore-cmp.tar.gz
        '
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_success
  needs:
    - frontend:build
  timeout: 20 minutes

# ─────────────────────────────────────────────────────────────────────────────
# 4 · Provision a new customer  (ported from deploy-customer.yml)
#
# GitLab has no workflow_dispatch. Run this from CI/CD → Pipelines →
# "Run pipeline", fill in the CUSTOMER_* fields, then start the manual job.
# ─────────────────────────────────────────────────────────────────────────────

provision:customer:
  stage: provision
  extends: .gcloud_image
  when: manual
  allow_failure: false
  environment:
    name: customer/$CUSTOMER_NAME
  timeout: 45 minutes
  script:
    - |
      set -euo pipefail
      if [ -z "${CUSTOMER_NAME}" ] || [ -z "${CUSTOMER_GCP_PROJECT_ID}" ] || [ -z "${CUSTOMER_ADMIN_EMAIL}" ]; then
        echo "✘ CUSTOMER_NAME, CUSTOMER_GCP_PROJECT_ID and CUSTOMER_ADMIN_EMAIL are required."
        echo "  Set them on the Run pipeline form."
        exit 1
      fi
    - |
      CUSTOMER="${CUSTOMER_NAME}"
      PROJECT_ID="${CUSTOMER_GCP_PROJECT_ID}"
      REGION="${CUSTOMER_REGION}"
      ZONE="${CUSTOMER_REGION}-a"
      MACHINE_TYPE="${CUSTOMER_MACHINE_TYPE}"
      ADMIN_EMAIL="${CUSTOMER_ADMIN_EMAIL}"
      VM_NAME="intellicore-${CUSTOMER}"
      IP_NAME="intellicore-${CUSTOMER}-ip"

      echo "=== Provisioning Intellicore CMP for: ${CUSTOMER} ==="

      gcloud config set project "${PROJECT_ID}"
      gcloud services enable compute.googleapis.com iap.googleapis.com --quiet

      gcloud compute addresses create "${IP_NAME}" --region "${REGION}" --quiet 2>/dev/null || true
      IP=$(gcloud compute addresses describe "${IP_NAME}" --region "${REGION}" --format='get(address)')
      DOMAIN="${IP//./-}.sslip.io"
      echo "Customer URL: https://${DOMAIN}"

      # Web ingress. Let's Encrypt needs :80 reachable for the HTTP-01 challenge.
      gcloud compute firewall-rules create "intellicore-${CUSTOMER}-web" \
        --allow=tcp:80,tcp:443 --target-tags="intellicore-${CUSTOMER}" \
        --source-ranges=0.0.0.0/0 --quiet 2>/dev/null || true

      # SSH via IAP only — port 22 is never open to the internet.
      gcloud compute firewall-rules create "intellicore-${CUSTOMER}-iap-ssh" \
        --allow=tcp:22 --target-tags="intellicore-${CUSTOMER}" \
        --source-ranges=35.235.240.0/20 --quiet 2>/dev/null || true

      gcloud compute instances create "${VM_NAME}" \
        --zone "${ZONE}" \
        --machine-type "${MACHINE_TYPE}" \
        --image-family ubuntu-2204-lts --image-project ubuntu-os-cloud \
        --boot-disk-size 50GB --boot-disk-type pd-balanced \
        --tags "intellicore-${CUSTOMER}" \
        --address "${IP_NAME}" \
        --metadata=startup-script='#!/bin/bash
      set -e
      if ! command -v docker >/dev/null; then
        curl -fsSL https://get.docker.com | sh
      fi
      systemctl enable --now docker' \
        --quiet 2>/dev/null || echo "VM exists, reusing"

      echo "── Waiting for Docker on the VM ──"
      for i in $(seq 1 30); do
        gcloud compute ssh "${VM_NAME}" --zone "${ZONE}" --tunnel-through-iap \
          --ssh-flag="-o StrictHostKeyChecking=no" \
          --command "sudo docker version >/dev/null 2>&1" 2>/dev/null && break
        sleep 10
      done

      # Secrets are generated here on the runner and injected once.
      ADMIN_PASSWORD=$(openssl rand -base64 16)
      PG_PASSWORD=$(openssl rand -hex 16)
      NEO_PASSWORD=$(openssl rand -hex 16)
      JWT=$(openssl rand -hex 32)
      CREDS_SECRET=$(openssl rand -hex 32)

      tar --exclude=node_modules --exclude=.next --exclude=__pycache__ \
          --exclude=.venv --exclude=.git --exclude='*.pyc' \
          -czf /tmp/intellicore-cmp.tar.gz .

      gcloud compute scp /tmp/intellicore-cmp.tar.gz \
        "${VM_NAME}":/tmp/ --zone "${ZONE}" --tunnel-through-iap \
        --scp-flag="-o StrictHostKeyChecking=no"

      gcloud compute ssh "${VM_NAME}" --zone "${ZONE}" --tunnel-through-iap \
        --ssh-flag="-o StrictHostKeyChecking=no" \
        --command "
          set -euo pipefail
          sudo usermod -aG docker \$(whoami) || true
          rm -rf ~/intellicore-cmp && mkdir -p ~/intellicore-cmp
          tar -xzf /tmp/intellicore-cmp.tar.gz -C ~/intellicore-cmp
          cd ~/intellicore-cmp

          # .env.prod belongs at the REPO ROOT — update.sh and this pipeline
          # both read it from there.
          cat > .env.prod <<ENVEOF
      DOMAIN=${DOMAIN}
      LETSENCRYPT_EMAIL=${ADMIN_EMAIL}
      POSTGRES_USER=intellicore
      POSTGRES_PASSWORD=${PG_PASSWORD}
      POSTGRES_DB=intellicore
      NEO4J_PASSWORD=${NEO_PASSWORD}
      JWT_SECRET=${JWT}
      CREDENTIALS_SECRET=${CREDS_SECRET}
      CLAUDE_MODEL=claude-sonnet-4-5
      TENANT_MODE=single
      LOG_LEVEL=INFO
      ADMIN_EMAIL=${ADMIN_EMAIL}
      ADMIN_PASSWORD=${ADMIN_PASSWORD}
      ENVEOF
          chmod 600 .env.prod

          sudo docker compose --env-file .env.prod \
            -f deploy/gcp/docker-compose.prod.yml up -d --build

          sleep 30
          sudo docker compose --env-file .env.prod \
            -f deploy/gcp/docker-compose.prod.yml exec -T backend \
            python -m scripts.create_admin || \
            echo '⚠ create_admin failed — run it manually'
          rm -f /tmp/intellicore-cmp.tar.gz
        "

      echo "=== Customer environment provisioned ==="
      echo "URL:      https://${DOMAIN}"
      echo "Admin:    ${ADMIN_EMAIL}"
      echo "Password: ${ADMIN_PASSWORD}"
      echo "VM:       ${VM_NAME} in ${ZONE}"
      echo ""
      echo "⚠ Copy the password now — it is not stored anywhere else."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

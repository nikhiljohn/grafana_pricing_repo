# ─── Intellicore CMP — GitLab CI/CD Pipeline ──────────────────────────────
# Stages:
#   1. build  — type-check + production build (catches errors before deploy)
#   2. deploy — SSH into GCP VM and run the update script
#
# Required CI/CD Variables (set in GitLab → Settings → CI/CD → Variables):
#   DEPLOY_SSH_KEY   — private SSH key (PEM, type: File, protected, masked)
#   VM_IP            — GCP VM public IP address (e.g. 35.234.213.235)
#   VM_USER          — SSH user on the VM (e.g. intellicore or ubuntu)
#   DOMAIN           — your sslip.io domain (e.g. 35-234-213-235.sslip.io)
#
# One-time setup: see deploy/gcp/GITLAB_CI.md
# ─────────────────────────────────────────────────────────────────────────────

default:
  interruptible: true

stages:
  - build
  - deploy

# ── 1. Build & type-check ────────────────────────────────────────────────────

frontend:build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── 2. Deploy to GCP VM ──────────────────────────────────────────────────────

deploy:production:
  stage: deploy
  image: alpine:3.19
  environment:
    name: production
    url: https://$DOMAIN
  before_script:
    - apk add --no-cache openssh-client bash git rsync
    # Load the deploy SSH key
    - eval $(ssh-agent -s)
    - chmod 400 "$DEPLOY_SSH_KEY"
    - ssh-add "$DEPLOY_SSH_KEY"
    # Trust the VM's host key (avoid interactive prompt)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts
  script:
    # Push latest code to the VM and trigger the update script
    - |
      ssh "$VM_USER@$VM_IP" 'bash -s' << 'REMOTE'
        set -euo pipefail
        cd ~/intellicore-cmp

        echo "── Pulling latest code ──────────────────────"
        git fetch origin
        git reset --hard origin/main

        echo "── Running update script ────────────────────"
        bash deploy/gcp/update.sh
      REMOTE
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  needs:
    - frontend:build
  timeout: 20 minutes

# ── 3. Deploy to staging (optional) ─────────────────────────────────────────

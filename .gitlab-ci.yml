# ─── Intellicore CMP — GitLab CI/CD Pipeline (Searce GCP) ────────────────
# Stages:
#   1. build  — type-check + production build (catches errors before deploy)
#   2. deploy — gcloud IAP tunnel SSH to GCP VM (no open port 22 needed)
#
# Required CI/CD Variables (GitLab → Settings → CI/CD → Variables):
#
#   GCP_SA_KEY       Type: File     The CI/CD service account JSON key
#                                   (generated by deploy/gcp/setup-searce-gcp.sh)
#   GCP_PROJECT_ID   Type: Variable e.g. intellicore-cmp-prod
#   VM_NAME          Type: Variable e.g. intellicore-cmp-prod
#   VM_ZONE          Type: Variable e.g. asia-south1-a
#   VM_USER          Type: Variable SSH user on the VM
#                                   (run: gcloud compute ssh $VM_NAME --zone $VM_ZONE --command 'whoami')
#   DOMAIN           Type: Variable e.g. intellicore-demo.searce.com
#
# One-time setup: bash deploy/gcp/setup-searce-gcp.sh
# Full guide:     deploy/gcp/GITLAB_CI.md
# ─────────────────────────────────────────────────────────────────────────────

default:
  interruptible: true

stages:
  - build
  - deploy

# ── 1. Build & type-check ────────────────────────────────────────────────────

frontend:build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── 2. Deploy via GCP IAP tunnel ─────────────────────────────────────────────
# Uses a GCP service account — no SSH keys, no open port 22.
# The IAP tunnel only allows access from the authenticated service account.

deploy:production:
  stage: deploy
  image: google/cloud-sdk:alpine
  environment:
    name: production
    url: https://$DOMAIN
  before_script:
    # Authenticate as the CI/CD service account
    - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
    - gcloud config set project "$GCP_PROJECT_ID"
    # Verify auth
    - gcloud auth list --filter=status:ACTIVE --format="value(account)"
  script:
    - |
      gcloud compute ssh "${VM_USER}@${VM_NAME}" \
        --zone="${VM_ZONE}" \
        --tunnel-through-iap \
        --ssh-flag="-o StrictHostKeyChecking=no" \
        --ssh-flag="-o ServerAliveInterval=30" \
        --command='
          set -euo pipefail
          cd ~/intellicore-cmp

          echo "── Pulling latest code ──────────────────────"
          git fetch origin main
          git reset --hard origin/main

          echo "── Updating dependencies ────────────────────"
          # Run update script (builds Docker images, rolling restart, health check)
          bash deploy/gcp/update.sh
        '
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  needs:
    - frontend:build
  timeout: 20 minutes

# ── 3. Staging deploy (optional) ─────────────────────────────────────────────

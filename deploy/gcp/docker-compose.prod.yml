# ─── Intellicore CMP — Production stack (GCP single-VM) ─────────────────
#
#   Internet ──► Caddy (:443, auto-TLS)
#                  ├── /login, /api/auth/*  ──► public (the login flow itself)
#                  ├── /api/*               ──► backend:8000   (session-gated)
#                  └── /*                   ──► frontend:3000  (session-gated)
#
# Auth is an interim app-gate: email/password + TOTP (Google Authenticator-
# compatible), enforced by Caddy's forward_auth against the backend's
# /auth/session/check. This is deliberately swappable — once this moves to
# the Searce GCP org, swap in Google Workspace SSO (oauth2-proxy) per
# deploy/gcp/README.md without touching the app itself.
#
# Only Caddy publishes host ports. Postgres / Neo4j / Redis / backend /
# frontend are reachable exclusively on the private compose network.
#
# Run from the repo root:
#   docker compose --env-file .env.prod -f deploy/gcp/docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: intellicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-intellicore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellicore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.20-community
    container_name: intellicore-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env.prod}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../../neo4j/init:/var/lib/neo4j/import/init
      - ../../neo4j/seed:/var/lib/neo4j/import/seed
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: intellicore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: intellicore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intellicore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intellicore}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      TENANT_MODE: ${TENANT_MODE:-single}
      CORS_ORIGINS: https://${DOMAIN:?set in .env.prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: intellicore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # Server components reach the backend over the private network.
      API_URL_INTERNAL: http://backend:8000

  caddy:
    image: caddy:2-alpine
    container_name: intellicore-edge
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  caddy_data:
  caddy_config:

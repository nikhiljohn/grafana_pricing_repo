name: Deploy to Staging
on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Package and deploy
        env:
          VM_NAME: ${{ vars.VM_NAME || 'intellicore-staging' }}
          VM_ZONE: ${{ vars.VM_ZONE || 'asia-south1-a' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # Package code
          tar --exclude=node_modules --exclude=.next --exclude=__pycache__ \
              --exclude=.venv --exclude=.git --exclude=.github \
              -czf /tmp/intellicore-cmp.tar.gz .

          # Copy to VM
          gcloud compute scp /tmp/intellicore-cmp.tar.gz \
            ${VM_NAME}:/tmp/ --zone ${VM_ZONE} --project ${PROJECT_ID}

          # Deploy on VM
          gcloud compute ssh ${VM_NAME} --zone ${VM_ZONE} --project ${PROJECT_ID} --command "
            set -e
            mkdir -p ~/intellicore-cmp-new
            tar -xzf /tmp/intellicore-cmp.tar.gz -C ~/intellicore-cmp-new

            # Preserve secrets
            if [ -f ~/intellicore-cmp/.env.prod ]; then
              cp ~/intellicore-cmp/.env.prod ~/intellicore-cmp-new/.env.prod
            fi

            # Swap directories
            if [ -d ~/intellicore-cmp ]; then
              mv ~/intellicore-cmp ~/intellicore-cmp-rollback
            fi
            mv ~/intellicore-cmp-new ~/intellicore-cmp

            # Rebuild and restart
            cd ~/intellicore-cmp
            sudo docker compose --env-file .env.prod \
              -f deploy/gcp/docker-compose.prod.yml up -d --build

            # Health check
            echo 'Waiting for services...'
            sleep 30
            curl -sf http://localhost:3000 > /dev/null && echo 'Frontend: OK' || echo 'Frontend: FAILED'
            curl -sf http://localhost:8000/health > /dev/null && echo 'Backend: OK' || echo 'Backend: FAILED'

            # Cleanup rollback after success
            rm -rf ~/intellicore-cmp-rollback
          "

      - name: Notify deployment
        if: success()
        run: echo "Deployed to staging successfully"
